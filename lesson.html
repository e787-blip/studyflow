<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StudyFlow — Today's Lesson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1a1d2e; --muted: #6b7280; --soft: #f4f6fb;
    --blue: #4a7cf6; --blue-light: #dce8ff; --white: #fff; --border: #e8ecf4;
    --green: #38bfa1; --red: #ef4444; --orange: #f59e0b;
    --sans: 'DM Sans', sans-serif; --serif: 'Instrument Serif', Georgia, serif;
  }
  body { font-family: var(--sans); color: var(--ink); background: var(--soft); min-height: 100vh; }

  @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes spin { to{transform:rotate(360deg)} }
  @keyframes shake { 0%,100%{transform:none} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

  /* NAV */
  nav {
    background:#fff; border-bottom:1px solid var(--border); padding:.85rem 2rem;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:100; box-shadow:0 1px 12px rgba(74,124,246,.07);
  }
  .logo { text-decoration:none; display:flex; align-items:center; }
  .nav-back { font-size:0.85rem; color:var(--muted); text-decoration:none; font-weight:500; padding:.4rem .9rem; border-radius:8px; border:1px solid var(--border); transition:all .2s; }
  .nav-back:hover { color:var(--blue); border-color:var(--blue); background:var(--blue-light); }
  .nav-center { display:flex; flex-direction:column; align-items:center; gap:.3rem; }
  .nav-step-label { font-size:0.72rem; color:var(--muted); font-weight:500; }
  .progress-bar { width:160px; height:5px; background:var(--border); border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--blue); border-radius:3px; transition:width .5s cubic-bezier(0.16,1,.3,1); }

  /* CONTAINER */
  .container { max-width:680px; margin:0 auto; padding:2.5rem 1.5rem 6rem; }

  /* CARD */
  .step-card {
    background:#fff; border:1.5px solid var(--border); border-radius:28px;
    overflow:hidden; box-shadow:0 8px 32px rgba(74,124,246,.08);
    animation:fadeUp .5s cubic-bezier(0.16,1,.3,1) both;
  }

  /* CARD HEADER */
  .card-header {
    background:linear-gradient(135deg,#4a7cf6,#2851c8);
    padding:1.8rem 2rem; position:relative; overflow:hidden;
  }
  .card-header::before { content:''; position:absolute; inset:0; background-image:radial-gradient(circle,rgba(255,255,255,.1) 1px,transparent 1px); background-size:24px 24px; pointer-events:none; }
  .card-header-badge { display:inline-flex; align-items:center; gap:.4rem; background:rgba(255,255,255,.2); color:#fff; font-size:0.7rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:.28rem .75rem; border-radius:999px; border:1px solid rgba(255,255,255,.3); margin-bottom:.7rem; position:relative; z-index:1; }
  .card-header h1 { font-family:var(--serif); font-size:clamp(1.4rem,3vw,1.9rem); color:#fff; letter-spacing:-0.02em; position:relative; z-index:1; line-height:1.2; }

  /* CARD BODY */
  .card-body { padding:2rem; }

  /* WELCOME */
  .welcome-text { font-size:1rem; color:var(--muted); font-weight:300; line-height:1.8; margin-bottom:1.5rem; }

  /* LESSON CONTENT */
  .lesson-content { font-size:0.97rem; color:var(--ink); line-height:1.85; font-weight:300; }
  .lesson-content p { margin-bottom:1rem; }
  .lesson-content p:last-child { margin-bottom:0; }
  .lesson-content strong { font-weight:600; color:var(--ink); }

  /* KEY TERMS */
  .terms-list { display:flex; flex-direction:column; gap:.75rem; }
  .term-item { background:var(--soft); border:1.5px solid var(--border); border-radius:14px; padding:1rem 1.2rem; }
  .term-word { font-size:0.92rem; font-weight:700; color:var(--blue); margin-bottom:.3rem; }
  .term-def { font-size:0.88rem; color:var(--muted); font-weight:300; line-height:1.6; }

  /* QUESTION */
  .q-header { margin-bottom:1.2rem; }
  .q-difficulty { display:inline-block; font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:.25rem .7rem; border-radius:999px; margin-bottom:.6rem; }
  .q-difficulty.easy { background:#d1faf0; color:#1a9e80; }
  .q-difficulty.medium { background:#fff0e0; color:#c06b1a; }
  .q-difficulty.hard { background:#fee2e2; color:#dc2626; }
  .q-text { font-size:1rem; font-weight:600; color:var(--ink); line-height:1.5; }
  .q-options { display:flex; flex-direction:column; gap:.5rem; margin-top:1.2rem; }
  .q-option {
    padding:.85rem 1.1rem; border-radius:14px; border:1.5px solid var(--border);
    background:var(--soft); font-family:var(--sans); font-size:0.92rem; font-weight:500;
    color:var(--ink); cursor:pointer; text-align:left; transition:all .2s;
    display:flex; align-items:center; gap:.75rem;
  }
  .q-option:hover:not(:disabled) { border-color:var(--blue); background:var(--blue-light); color:var(--blue); }
  .q-option.selected { border-color:var(--blue); background:var(--blue); color:#fff; }
  .q-option.correct { border-color:var(--green); background:#d1faf0; color:#1a9e80; }
  .q-option.wrong { border-color:var(--red); background:#fee2e2; color:#dc2626; animation:shake .3s ease; }
  .q-option:disabled { cursor:not-allowed; }
  .option-letter { width:26px; height:26px; border-radius:7px; background:rgba(0,0,0,.06); display:flex; align-items:center; justify-content:center; font-size:0.75rem; font-weight:700; flex-shrink:0; }
  .q-option.selected .option-letter { background:rgba(255,255,255,.25); color:#fff; }

  /* TRUE FALSE */
  .tf-grid { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; margin-top:1.2rem; }
  .tf-btn {
    padding:1rem; border-radius:14px; border:1.5px solid var(--border);
    background:var(--soft); font-family:var(--sans); font-size:1rem; font-weight:600;
    color:var(--ink); cursor:pointer; transition:all .2s; text-align:center;
  }
  .tf-btn:hover:not(:disabled) { border-color:var(--blue); background:var(--blue-light); color:var(--blue); }
  .tf-btn.selected { border-color:var(--blue); background:var(--blue); color:#fff; }
  .tf-btn.correct { border-color:var(--green); background:#d1faf0; color:#1a9e80; }
  .tf-btn.wrong { border-color:var(--red); background:#fee2e2; color:#dc2626; }
  .tf-btn:disabled { cursor:not-allowed; }

  /* HINT */
  .hint-row { margin-top:1.2rem; }
  .hint-btn { background:none; border:1.5px solid var(--border); color:var(--muted); padding:.45rem .9rem; border-radius:8px; font-family:var(--sans); font-size:0.82rem; font-weight:500; cursor:pointer; transition:all .2s; }
  .hint-btn:hover { border-color:var(--orange); color:var(--orange); background:#fff8e0; }
  .hint-box { display:none; margin-top:.75rem; padding:.8rem 1rem; background:#fff8e0; border:1px solid #f59e0b; border-radius:10px; font-size:0.85rem; color:#92400e; line-height:1.6; }
  .hint-box.show { display:block; animation:fadeIn .3s ease; }

  /* FEEDBACK */
  .feedback-box { margin-top:1.2rem; border-radius:14px; padding:1rem 1.2rem; display:none; animation:fadeIn .3s ease; }
  .feedback-box.show { display:block; }
  .feedback-box.correct-fb { background:#d1faf0; border:1.5px solid var(--green); }
  .feedback-box.wrong-fb { background:#fee2e2; border:1.5px solid var(--red); }
  .feedback-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; }
  .correct-fb .feedback-label { color:#1a9e80; }
  .wrong-fb .feedback-label { color:#dc2626; }
  .feedback-text { font-size:0.88rem; line-height:1.6; }
  .correct-fb .feedback-text { color:#065f46; }
  .wrong-fb .feedback-text { color:#7f1d1d; }

  /* CARD FOOTER */
  .card-footer { padding:1.5rem 2rem; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .step-counter { font-size:0.8rem; color:var(--muted); font-weight:500; }
  .btn-next {
    background:var(--blue); color:#fff; padding:.85rem 2rem; border-radius:12px;
    font-family:var(--sans); font-size:0.95rem; font-weight:600; border:none; cursor:pointer;
    transition:all .3s cubic-bezier(0.16,1,.3,1); box-shadow:0 4px 14px rgba(74,124,246,.3);
  }
  .btn-next:hover { background:#3567e0; transform:translateY(-2px); box-shadow:0 8px 22px rgba(74,124,246,.4); }
  .btn-next:disabled { background:var(--border); color:var(--muted); cursor:not-allowed; transform:none; box-shadow:none; }

  /* RESULTS */
  .results-card { background:#fff; border:1.5px solid var(--border); border-radius:28px; overflow:hidden; box-shadow:0 8px 32px rgba(74,124,246,.08); display:none; animation:fadeUp .5s cubic-bezier(0.16,1,.3,1) both; }
  .results-card.show { display:block; }
  .results-top { padding:2.5rem 2rem; text-align:center; }
  .results-top.great { background:linear-gradient(135deg,#38bfa1,#059669); }
  .results-top.good { background:linear-gradient(135deg,#4a7cf6,#2851c8); }
  .results-top.retry { background:linear-gradient(135deg,#f59e0b,#d97706); }
  .results-score { font-size:4.5rem; font-weight:700; color:#fff; line-height:1; }
  .results-msg { font-size:1rem; color:rgba(255,255,255,.85); margin-top:.5rem; }
  .results-body { padding:2rem; }
  .results-body h3 { font-family:var(--serif); font-size:1.3rem; color:var(--ink); margin-bottom:1rem; }
  .wrong-item { background:var(--soft); border:1.5px solid var(--border); border-left:4px solid var(--red); border-radius:14px; padding:1.2rem 1.5rem; margin-bottom:.8rem; }
  .wi-q { font-size:0.92rem; font-weight:600; color:var(--ink); margin-bottom:.4rem; }
  .wi-yours { font-size:0.82rem; color:#dc2626; margin-bottom:.2rem; }
  .wi-correct { font-size:0.82rem; color:#1a9e80; margin-bottom:.5rem; }
  .wi-why { font-size:0.82rem; color:var(--muted); line-height:1.6; padding:.65rem .9rem; background:#fff; border-radius:8px; }
  .all-correct-msg { background:#d1faf0; border:1.5px solid var(--green); border-radius:14px; padding:1.2rem; text-align:center; color:#1a9e80; font-weight:600; font-size:0.95rem; margin-bottom:1rem; }
  .btn-dashboard { width:100%; padding:1rem; background:var(--blue); color:#fff; border:none; border-radius:14px; font-family:var(--sans); font-size:1rem; font-weight:600; cursor:pointer; transition:all .3s; box-shadow:0 4px 14px rgba(74,124,246,.3); margin-top:1.5rem; }
  .btn-dashboard:hover { background:#3567e0; transform:translateY(-2px); }
</style>
</head>
<body>

<nav>
  <a href="dashboard.html" class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 44" width="130" height="32">
      <defs><linearGradient id="ig" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#5b8df8"/><stop offset="100%" style="stop-color:#2851c8"/></linearGradient></defs>
      <rect x="0" y="2" width="40" height="40" rx="10" fill="url(#ig)"/>
      <rect x="8" y="10" width="17" height="22" rx="3" fill="white" opacity="0.25"/>
      <rect x="11" y="10" width="17" height="22" rx="3" fill="white" opacity="0.35"/>
      <rect x="14" y="10" width="17" height="22" rx="3" fill="white"/>
      <rect x="17" y="16" width="11" height="2" rx="1" fill="#4a7cf6"/>
      <rect x="17" y="21" width="8" height="2" rx="1" fill="#4a7cf6" opacity="0.6"/>
      <rect x="17" y="26" width="10" height="2" rx="1" fill="#4a7cf6" opacity="0.4"/>
      <path d="M33 8 L34 11.5 L37.5 12.5 L34 13.5 L33 17 L32 13.5 L28.5 12.5 L32 11.5 Z" fill="white"/>
      <text x="48" y="28" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3">
        <tspan fill="#1a1d2e">Study</tspan><tspan fill="#4a7cf6">Flow</tspan>
      </text>
    </svg>
  </a>
  <div class="nav-center">
    <div class="nav-step-label" id="nav-step-label">Loading...</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <a href="dashboard.html" class="nav-back">← Dashboard</a>
</nav>

<div class="container">
  <div class="step-card" id="step-card"></div>
  <div class="results-card" id="results-card"></div>
</div>

<script>
  var plan, day, dayIndex;
  var steps = [];
  var currentStep = 0;
  var answers = {};
  var wrongItems = [];

  function init() {
    var saved = localStorage.getItem('studyflow_plan');
    dayIndex = parseInt(localStorage.getItem('studyflow_current_day') || '0');
    var minutes = parseInt(localStorage.getItem('studyflow_minutes') || '30');
    if (!saved) { window.location.href = 'dashboard.html'; return; }
    plan = JSON.parse(saved);
    day = JSON.parse(JSON.stringify(plan.days[dayIndex])); // deep copy
    if (!day) { window.location.href = 'dashboard.html'; return; }

    // Adapt questions based on time
    if (day.questions && day.questions.length > 0) {
      var qPerMin = 0.15; // roughly 1 question per 6-7 min
      var maxQ = Math.max(1, Math.round(minutes * qPerMin));
      if (minutes <= 15) maxQ = Math.min(2, day.questions.length);
      else if (minutes <= 30) maxQ = Math.min(4, day.questions.length);
      else maxQ = day.questions.length;
      day.questions = day.questions.slice(0, maxQ);
    }

    buildSteps();
    renderStep();
  }

  function buildSteps() {
    steps = [];
    // Step 1: Welcome
    steps.push({ type: 'welcome' });
    // Step 2: Lesson content
    if (day.content) steps.push({ type: 'lesson' });
    // Step 3: Key terms (day 1 only)
    if (dayIndex === 0 && day.keyTerms && day.keyTerms.length) steps.push({ type: 'terms' });
    // Questions — one per step
    if (day.questions) {
      day.questions.forEach(function(q, i) { steps.push({ type: 'question', index: i }); });
    }
  }

  function updateProgress() {
    var pct = Math.round((currentStep / (steps.length - 1)) * 100);
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('nav-step-label').textContent = 'Step ' + (currentStep + 1) + ' of ' + steps.length;
  }

  function renderStep() {
    updateProgress();
    var step = steps[currentStep];
    var html = '';
    var isLast = currentStep === steps.length - 1;
    var stepNum = currentStep + 1;
    var totalSteps = steps.length;

    if (step.type === 'welcome') {
      var dayLabel = dayIndex === 0 ? 'Introduction' : (day.isFinal ? 'Final Exam Day' : 'Day ' + (dayIndex + 1));
      html = '<div class="card-header">' +
        '<div class="card-header-badge">✦ ' + dayLabel + '</div>' +
        '<h1>' + (day.title || 'Day ' + (dayIndex + 1)) + '</h1>' +
        '</div>' +
        '<div class="card-body">' +
        '<p class="welcome-text">' + (day.briefing || '') + '</p>' +
        '</div>' +
        '<div class="card-footer">' +
        '<span class="step-counter">' + stepNum + ' / ' + totalSteps + '</span>' +
        '<button class="btn-next" onclick="nextStep()">Let\'s go →</button>' +
        '</div>';
    }

    else if (step.type === 'lesson') {
      html = '<div class="card-header">' +
        '<div class="card-header-badge">Today\'s Lesson</div>' +
        '<h1>' + (day.title || '') + '</h1>' +
        '</div>' +
        '<div class="card-body">' +
        '<div class="lesson-content">' + formatContent(day.content) + '</div>' +
        '</div>' +
        '<div class="card-footer">' +
        '<span class="step-counter">' + stepNum + ' / ' + totalSteps + '</span>' +
        '<button class="btn-next" onclick="nextStep()">Next →</button>' +
        '</div>';
    }

    else if (step.type === 'terms') {
      var termsHtml = '<div class="terms-list">';
      day.keyTerms.forEach(function(t) {
        termsHtml += '<div class="term-item"><div class="term-word">' + t.term + '</div><div class="term-def">' + t.definition + '</div></div>';
      });
      termsHtml += '</div>';
      html = '<div class="card-header">' +
        '<div class="card-header-badge">Key Terms</div>' +
        '<h1>Words to Know</h1>' +
        '</div>' +
        '<div class="card-body">' + termsHtml + '</div>' +
        '<div class="card-footer">' +
        '<span class="step-counter">' + stepNum + ' / ' + totalSteps + '</span>' +
        '<button class="btn-next" onclick="nextStep()">Next →</button>' +
        '</div>';
    }

    else if (step.type === 'question') {
      var qi = step.index;
      var q = day.questions[qi];
      var qNum = day.questions.indexOf(q) + 1;
      var totalQ = day.questions.length;
      var diffClass = (q.difficulty || 'easy').toLowerCase();
      var answered = answers[qi] !== undefined;

      var optionsHtml = '';
      if (q.type === 'truefalse') {
        var tSel = answers[qi] === 'True' ? ' selected' : '';
        var fSel = answers[qi] === 'False' ? ' selected' : '';
        optionsHtml = '<div class="tf-grid">' +
          '<button class="tf-btn' + tSel + '" onclick="selectTF(' + qi + ', \'True\')" id="tf-' + qi + '-True">True</button>' +
          '<button class="tf-btn' + fSel + '" onclick="selectTF(' + qi + ', \'False\')" id="tf-' + qi + '-False">False</button>' +
          '</div>';
      } else {
        optionsHtml = '<div class="q-options">';
        var letters = ['A','B','C','D'];
        q.options.forEach(function(opt, oi) {
          var sel = answers[qi] === oi ? ' selected' : '';
          optionsHtml += '<button class="q-option' + sel + '" onclick="selectMCQ(' + qi + ',' + oi + ')" id="opt-' + qi + '-' + oi + '">' +
            '<span class="option-letter">' + letters[oi] + '</span>' + opt + '</button>';
        });
        optionsHtml += '</div>';
      }

      html = '<div class="card-header">' +
        '<div class="card-header-badge">Question ' + qNum + ' of ' + totalQ + '</div>' +
        '<h1>' + (day.isFinal ? 'Final Test' : 'Practice Questions') + '</h1>' +
        '</div>' +
        '<div class="card-body">' +
        '<div class="q-header">' +
        '<span class="q-difficulty ' + diffClass + '">' + (q.difficulty || 'Medium') + '</span>' +
        '<div class="q-text">' + q.question + '</div>' +
        '</div>' +
        optionsHtml +
        '<div class="hint-row">' +
        '<button class="hint-btn" onclick="toggleHint(' + qi + ')">Show hint</button>' +
        '<div class="hint-box" id="hint-' + qi + '">' + (q.hint || 'Think carefully about today\'s lesson.') + '</div>' +
        '</div>' +
        '<div class="feedback-box" id="fb-' + qi + '"></div>' +
        '</div>' +
        '<div class="card-footer">' +
        '<span class="step-counter">Q' + qNum + ' / ' + totalQ + '</span>' +
        '<button class="btn-next" id="btn-next-q" onclick="nextStep()" ' + (answered ? '' : 'disabled') + '>' + (isLast ? 'See results →' : 'Next →') + '</button>' +
        '</div>';
    }

    document.getElementById('step-card').innerHTML = html;
    document.getElementById('step-card').style.animation = 'none';
    void document.getElementById('step-card').offsetWidth;
    document.getElementById('step-card').style.animation = 'fadeUp .4s cubic-bezier(0.16,1,.3,1) both';
  }

  function formatContent(content) {
    if (!content) return '';
    return content.split('\n').filter(function(l){ return l.trim(); }).map(function(l){
      return '<p>' + l + '</p>';
    }).join('');
  }

  function selectMCQ(qi, oi) {
    if (answers[qi] !== undefined) return;
    var q = day.questions[qi];
    answers[qi] = oi;
    var opts = document.querySelectorAll('[id^="opt-' + qi + '-"]');
    opts.forEach(function(o) { o.disabled = true; o.classList.remove('selected'); });
    document.getElementById('opt-' + qi + '-' + oi).classList.add('selected');
    var isCorrect = oi === q.correctIndex;
    showFeedback(qi, isCorrect, q);
    if (!isCorrect) {
      document.getElementById('opt-' + qi + '-' + oi).classList.add('wrong');
      document.getElementById('opt-' + qi + '-' + q.correctIndex).classList.add('correct');
      wrongItems.push({ q: q, userAns: q.options[oi] });
    } else {
      document.getElementById('opt-' + qi + '-' + oi).classList.add('correct');
    }
    document.getElementById('btn-next-q').disabled = false;
  }

  function selectTF(qi, val) {
    if (answers[qi] !== undefined) return;
    var q = day.questions[qi];
    answers[qi] = val;
    document.getElementById('tf-' + qi + '-True').disabled = true;
    document.getElementById('tf-' + qi + '-False').disabled = true;
    document.getElementById('tf-' + qi + '-' + val).classList.add('selected');
    var isCorrect = val === q.correct;
    showFeedback(qi, isCorrect, q);
    if (!isCorrect) {
      document.getElementById('tf-' + qi + '-' + val).classList.add('wrong');
      document.getElementById('tf-' + qi + '-' + q.correct).classList.add('correct');
      wrongItems.push({ q: q, userAns: val });
    } else {
      document.getElementById('tf-' + qi + '-' + val).classList.add('correct');
    }
    document.getElementById('btn-next-q').disabled = false;
  }

  function showFeedback(qi, isCorrect, q) {
    var fb = document.getElementById('fb-' + qi);
    if (!fb) return;
    fb.className = 'feedback-box show ' + (isCorrect ? 'correct-fb' : 'wrong-fb');
    fb.innerHTML = '<div class="feedback-label">' + (isCorrect ? 'Correct!' : 'Not quite') + '</div>' +
      '<div class="feedback-text">' + (q.explanation || (isCorrect ? 'Great job!' : 'Review the explanation and keep going.')) + '</div>';
  }

  function toggleHint(qi) {
    var box = document.getElementById('hint-' + qi);
    box.classList.toggle('show');
    var btn = box.previousElementSibling;
    btn.textContent = box.classList.contains('show') ? 'Hide hint' : 'Show hint';
  }

  function nextStep() {
    if (currentStep < steps.length - 1) {
      currentStep++;
      renderStep();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      showResults();
    }
  }

  function showResults() {
    document.getElementById('step-card').style.display = 'none';
    var totalQ = day.questions ? day.questions.length : 0;
    var correct = totalQ - wrongItems.length;
    var pct = totalQ > 0 ? Math.round((correct / totalQ) * 100) : 100;
    document.getElementById('progress-fill').style.width = '100%';
    document.getElementById('nav-step-label').textContent = 'Complete!';

    var topClass = pct >= 80 ? 'great' : (pct >= 60 ? 'good' : 'retry');
    var msg = pct >= 80 ? 'Excellent work — you nailed it!' : (pct >= 60 ? 'Good job — review the ones you missed.' : 'Keep studying — you\'ll get it!');

    var wrongHtml = '';
    if (wrongItems.length === 0) {
      wrongHtml = '<div class="all-correct-msg">Perfect score! Every answer was correct!</div>';
    } else {
      wrongHtml = '<h3>Review — What to Study More</h3>';
      wrongItems.forEach(function(item) {
        var correctAns = item.q.type === 'truefalse' ? item.q.correct : item.q.options[item.q.correctIndex];
        wrongHtml += '<div class="wrong-item">' +
          '<div class="wi-q">' + item.q.question + '</div>' +
          '<div class="wi-yours">Your answer: ' + item.userAns + '</div>' +
          '<div class="wi-correct">Correct answer: ' + correctAns + '</div>' +
          '<div class="wi-why">' + (item.q.explanation || 'Review this in your notes.') + '</div>' +
          '</div>';
      });
    }

    var nextLabel = day.isFinal || dayIndex >= plan.days.length - 1 ? 'Back to dashboard →' : 'Continue to Day ' + (dayIndex + 2) + ' →';

    document.getElementById('results-card').innerHTML =
      '<div class="results-top ' + topClass + '">' +
        '<div class="results-score">' + correct + '/' + totalQ + '</div>' +
        '<div class="results-msg">' + msg + '</div>' +
      '</div>' +
      '<div class="results-body">' + wrongHtml +
        '<button class="btn-dashboard" onclick="finishDay()">' + nextLabel + '</button>' +
      '</div>';

    document.getElementById('results-card').classList.add('show');

    plan.days[dayIndex].completed = true;
    plan.days[dayIndex].score = pct;
    localStorage.setItem('studyflow_plan', JSON.stringify(plan));
  }

  function finishDay() {
    if (!day.isFinal && dayIndex < plan.days.length - 1) {
      localStorage.setItem('studyflow_current_day', dayIndex + 1);
    }
    window.location.href = 'dashboard.html';
  }

  init();
</script>
</body>
</html>

<link rel="stylesheet" href="base.css">
<!-- One page, three directions: ?dir=a|b|c picks the stylesheet before the
     first paint, ?theme=dark the theme, ?card=N the card to open on. -->
<script>
  (function () {
    var q = new URLSearchParams(location.search), d = q.get('dir');
    if (!/^[abc]$/.test(d || '')) d = 'a';
    var r = document.documentElement;
    r.dataset.dir = d;
    r.dataset.theme = q.get('theme') === 'dark' ? 'dark' : 'light';
    document.write('<link rel="stylesheet" href="' + d + '.css">');
  })();
</script>
</head>

</body>

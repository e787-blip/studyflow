<!doctype html>
<meta charset="utf-8">
<title>prep illustration</title>
<!-- The browser half of prep_illustration.py (run that, not this). Needs real
     layout: a label's place is its box after every transform in the file,
     which only a browser can measure. Reads ?src= (a cleaned SVG on this
     server), ?job= (JSON: see sf-illustrate.js), and posts the result to
     /__write?name=<id>.svg on the harness server. The work itself is
     sf-illustrate.js - the same code the lesson page runs on a picture it
     finds live, so the two cannot drift apart. -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
<body style="margin:0">
<script src="/sf-illustrate.js"></script>
<script>
(async function () {
  var q = new URLSearchParams(location.search);
  var job = JSON.parse(q.get('job'));
  function post(name, text) { return fetch('/__write?name=' + encodeURIComponent(name), { method: 'POST', body: text }); }
  try {
    var txt = await (await fetch(q.get('src'), { cache: 'no-store' })).text();
    var res = await SFIllustrate.prepare(txt, job);
    await post(job.id + '.svg', res.svg);
    await post(job.id + '.report.json', JSON.stringify(res.report));
  } catch (e) {
    await post((job && job.id || 'x') + '.report.json', JSON.stringify({ error: String(e && e.stack || e) }));
  }
  await post('prep.done', 'done');
})();
</script>
</body>
